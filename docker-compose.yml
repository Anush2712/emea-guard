# EMEA Guard full stack: PostgreSQL + FastAPI + React (nginx)
#   docker compose up --build    ->  http://localhost:8080  (API docs: http://localhost:8080/docs)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: emea_guard
      POSTGRES_USER: emea_guard
      POSTGRES_PASSWORD: emea_guard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emea_guard -d emea_guard"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      EMEA_GUARD_DATABASE_URL: postgresql+psycopg://emea_guard:emea_guard@db:5432/emea_guard
      EMEA_GUARD_JWT_SECRET: ${EMEA_GUARD_JWT_SECRET:-change-me-in-production}
      EMEA_GUARD_SEED_ON_STARTUP: "true"
      EMEA_GUARD_APP_BASE_URL: http://localhost:8080
      # Optional: SMTP for password reset emails. Without it, the reset link is logged and shown in development.
      EMEA_GUARD_SMTP_HOST: ${EMEA_GUARD_SMTP_HOST:-}
      EMEA_GUARD_SMTP_USERNAME: ${EMEA_GUARD_SMTP_USERNAME:-}
      EMEA_GUARD_SMTP_PASSWORD: ${EMEA_GUARD_SMTP_PASSWORD:-}
      EMEA_GUARD_SMTP_FROM: ${EMEA_GUARD_SMTP_FROM:-EMEA Guard <no-reply@emea-guard.local>}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
