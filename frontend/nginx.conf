server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Same-origin API: no CORS needed in the containerised deployment.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    # Overwrite (never append to) any client-supplied value, so the API's rate limiter sees the real peer.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
  }
  location = /health { proxy_pass http://api:8000; }
  location /docs { proxy_pass http://api:8000; }
  location = /openapi.json { proxy_pass http://api:8000; }
  location / { try_files $uri /index.html; }
}
