# One-click full-stack deployment on Render (free tier): PostgreSQL + FastAPI API.
# Dashboard -> New -> Blueprint -> select this repo.
databases:
  - name: emea-guard-db
    plan: free
    databaseName: emea_guard
    user: emea_guard

services:
  - type: web
    name: emea-guard-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: EMEA_GUARD_DATABASE_URL
        fromDatabase:
          name: emea-guard-db
          property: connectionString
      - key: EMEA_GUARD_JWT_SECRET
        generateValue: true
      - key: EMEA_GUARD_SEED_ON_STARTUP
        value: "true"
