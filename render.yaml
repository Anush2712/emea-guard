# One-click full-stack deployment on Render (free tier): PostgreSQL + FastAPI API.
# Dashboard -> New -> Blueprint -> select this repo.
databases:
  - name: emea-guard-db
    plan: free
    databaseName: emea_guard
    user: emea_guard

services:
  - type: web
    name: emea-guard-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: EMEA_GUARD_DATABASE_URL
        fromDatabase:
          name: emea-guard-db
          property: connectionString
      - key: EMEA_GUARD_JWT_SECRET
        generateValue: true
      - key: EMEA_GUARD_SEED_ON_STARTUP
        value: "true"
      - key: EMEA_GUARD_ENVIRONMENT
        value: production
      - key: EMEA_GUARD_CORS_ORIGINS
        value: https://anush2712.github.io
      - key: EMEA_GUARD_APP_BASE_URL
        value: https://anush2712.github.io/emea-guard
      # Forwarding headers are ignored by default. Configure trusted peer networks
      # and a hop count only if the deployment has a verified ingress configuration.
      # Password reset emails. Render's free tier blocks outbound SMTP, so use the Resend HTTPS API
      # (free plan; create an API key at resend.com). On a paid instance you can use SMTP instead.
      - key: EMEA_GUARD_RESEND_API_KEY
        sync: false
      - key: EMEA_GUARD_SMTP_FROM
        sync: false
