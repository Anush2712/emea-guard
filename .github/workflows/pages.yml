name: Deploy live demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Regenerate the API snapshot from the real backend
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt  # export uses FastAPI TestClient (httpx)
          python -m app.scripts.export_demo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build static demo
        working-directory: frontend
        env:
          # Set the repository variable EMEA_GUARD_API_URL (e.g. https://emea-guard-api.onrender.com) to make the
          # live site use the hosted API and PostgreSQL accounts instead of the bundled snapshot.
          VITE_API_URL: ${{ vars.EMEA_GUARD_API_URL }}
        run: |
          npm ci
          npm test
          npm run build:demo
          touch dist/.nojekyll
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          force_orphan: true
          commit_message: "Deploy live demo"
