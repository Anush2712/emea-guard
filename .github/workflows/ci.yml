name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: emea_guard
          POSTGRES_USER: emea_guard
          POSTGRES_PASSWORD: emea_guard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U emea_guard" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Tests on SQLite
        run: pytest -q
      - name: Tests on PostgreSQL
        env:
          EMEA_GUARD_DATABASE_URL: postgresql+psycopg://emea_guard:emea_guard@localhost:5432/emea_guard
        run: pytest -q

  frontend:
    name: Frontend build + engine parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Export API snapshot + parity fixtures from the Python engine
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m app.scripts.export_demo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  docker:
    name: Docker compose smoke test
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait
      - name: Smoke test through nginx
        run: |
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/api/metrics | tee metrics.json
          python3 -c "import json;m=json.load(open('metrics.json'));assert m['jurisdictions']==10 and m['control_assessments']>=100, m"
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/login -d 'username=auditor&password=auditor123' | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/audit/verify
      - if: failure()
        run: docker compose logs
